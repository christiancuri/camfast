# CamFast config for the demo cameras served by scripts/demo/run.sh.
# run.sh prints the launch command; it points CAMFAST_CONFIG at a copy in ~/.cache/camfast-demo/run/
# because CamFast writes its config back (window position, edits).
open_at_login = false
smooth_playback = false
# Top-left, top-right, bottom-left, bottom-right.
