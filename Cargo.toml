[workspace]
members = [".", "crates/cam_config", "crates/cam_stream", "crates/cam_platform"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
cam_config = { path = "crates/cam_config" }
cam_stream = { path = "crates/cam_stream" }
cam_platform = { path = "crates/cam_platform" }

gpui = { git = "https://github.com/zed-industries/zed", rev = "4c902c9db22a82f5f3a14c02442e7f60ec40d9c8", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "4c902c9db22a82f5f3a14c02442e7f60ec40d9c8", features = ["font-kit"] }
# Must match the version gpui resolves, otherwise gpui::surface() rejects the CVPixelBuffer type.
core-video = "=0.5.2"
core-foundation = "0.10.1"

retina = "0.4.20"
tokio = { version = "1.53", features = ["rt-multi-thread", "time", "sync", "macros", "net"] }
futures = "0.3"
async-channel = "2.5"
parking_lot = "0.12"
uuid = { version = "1.26", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "7"
rand = "0.10"
url = "2"

objc2 = "0.6.4"
block2 = "0.6"
objc2-foundation = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-video-toolbox = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-service-management = "0.3.2"

[package]
name = "camfast"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cam_config.workspace = true
cam_stream.workspace = true
cam_platform.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
core-video.workspace = true
uuid.workspace = true
anyhow.workspace = true
futures.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
